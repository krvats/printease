<svg width="720" height="180" viewBox="0 0 720 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="180" fill="#0A0800"/>

  <!-- Film perforations — left strip -->
  <rect x="0" y="0" width="38" height="180" fill="#0E0B00"/>
  <rect x="8"  y="12"  width="22" height="16" rx="3" fill="#0A0800" stroke="#2D2200" stroke-width="1"/>
  <rect x="8"  y="38"  width="22" height="16" rx="3" fill="#0A0800" stroke="#2D2200" stroke-width="1"/>
  <rect x="8"  y="64"  width="22" height="16" rx="3" fill="#0A0800" stroke="#2D2200" stroke-width="1"/>
  <rect x="8"  y="90"  width="22" height="16" rx="3" fill="#0A0800" stroke="#2D2200" stroke-width="1"/>
  <rect x="8"  y="116" width="22" height="16" rx="3" fill="#0A0800" stroke="#2D2200" stroke-width="1"/>
  <rect x="8"  y="142" width="22" height="16" rx="3" fill="#0A0800" stroke="#2D2200" stroke-width="1"/>
  <line x1="38" y1="0" x2="38" y2="180" stroke="#1A1200" stroke-width="1"/>

  <!-- Film perforations — right strip -->
  <rect x="682" y="0" width="38" height="180" fill="#0E0B00"/>
  <rect x="690" y="12"  width="22" height="16" rx="3" fill="#0A0800" stroke="#2D2200" stroke-width="1"/>
  <rect x="690" y="38"  width="22" height="16" rx="3" fill="#0A0800" stroke="#2D2200" stroke-width="1"/>
  <rect x="690" y="64"  width="22" height="16" rx="3" fill="#0A0800" stroke="#2D2200" stroke-width="1"/>
  <rect x="690" y="90"  width="22" height="16" rx="3" fill="#0A0800" stroke="#2D2200" stroke-width="1"/>
  <rect x="690" y="116" width="22" height="16" rx="3" fill="#0A0800" stroke="#2D2200" stroke-width="1"/>
  <rect x="690" y="142" width="22" height="16" rx="3" fill="#0A0800" stroke="#2D2200" stroke-width="1"/>
  <line x1="682" y1="0" x2="682" y2="180" stroke="#1A1200" stroke-width="1"/>

  <!-- Printer SVG icon, centered left of text -->
  <g transform="translate(80,56)">
    <rect x="0" y="22" width="80" height="40" rx="3" fill="#2D2200" stroke="#C8820A" stroke-width="1.5"/>
    <rect x="10" y="10" width="60" height="20" rx="2" fill="#221800" stroke="#C8820A" stroke-width="1.2"/>
    <rect x="18" y="4" width="44" height="12" rx="1.5" fill="#2D2200" stroke="#806030" stroke-width="1"/>
    <rect x="16" y="37" width="48" height="4" rx="1.5" fill="#0A0800" opacity=".9"/>
    <rect x="22" y="13" width="36" height="28" rx="1.5" fill="#E8D090" opacity=".9"/>
    <rect x="27" y="16" width="24" height="2.5" rx="1" fill="#806030" opacity=".5"/>
    <rect x="27" y="21" width="18" height="2.5" rx="1" fill="#806030" opacity=".5"/>
    <rect x="27" y="26" width="21" height="2.5" rx="1" fill="#806030" opacity=".5"/>
    <rect x="27" y="31" width="15" height="2.5" rx="1" fill="#806030" opacity=".5"/>
    <circle cx="12" cy="47" r="4" fill="#C8820A" filter="url(#glow)"/>
    <circle cx="22" cy="47" r="4" fill="#806030"/>
    <rect x="32" y="43" width="30" height="8" rx="1.5" fill="#0A0800" opacity=".5"/>
  </g>

  <!-- PRINTEASE main title -->
  <text x="210" y="85"
    font-family="'Special Elite', 'Courier New', serif"
    font-size="58"
    font-weight="400"
    fill="#C8820A"
    filter="url(#glow)"
    letter-spacing="2">PrintEase</text>

  <!-- Underline rule -->
  <line x1="210" y1="96" x2="596" y2="96" stroke="#C8820A" stroke-width="1" opacity=".5"/>

  <!-- Tagline -->
  <text x="210" y="118"
    font-family="'Courier New', monospace"
    font-size="14"
    fill="#806030"
    letter-spacing="4">EVERY PAGE, PERFECTLY PRINTED</text>

  <!-- Feature pills -->
  <g transform="translate(210, 132)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="80" height="20" rx="2" fill="#1A1200" stroke="#2D2200" stroke-width="1"/>
    <text x="8" y="13.5" font-family="'Courier New', monospace" font-size="10" fill="#806030">USB + Network</text>

    <!-- Pill 2 -->
    <rect x="88" y="0" width="80" height="20" rx="2" fill="#1A1200" stroke="#2D2200" stroke-width="1"/>
    <text x="96" y="13.5" font-family="'Courier New', monospace" font-size="10" fill="#806030">Arch · Ubuntu</text>

    <!-- Pill 3 -->
    <rect x="176" y="0" width="80" height="20" rx="2" fill="#1A1200" stroke="#2D2200" stroke-width="1"/>
    <text x="184" y="13.5" font-family="'Courier New', monospace" font-size="10" fill="#806030">50+ Printers</text>

    <!-- Pill 4 -->
    <rect x="264" y="0" width="66" height="20" rx="2" fill="#1A1200" stroke="#C8820A" stroke-width="1" opacity=".7"/>
    <text x="272" y="13.5" font-family="'Courier New', monospace" font-size="10" fill="#C8820A">MIT License</text>
  </g>

  <!-- Version watermark bottom right -->
  <text x="660" y="170" font-family="'Courier New', monospace" font-size="9" fill="#2D2200" text-anchor="middle">v2.0</text>
</svg>
